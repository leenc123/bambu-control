name: bambu_lab_app
description: "Bambu Lab 3D Printer Control App"
publish_to: 'none'
version: 0.0.1+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # Lottie animation
  lottie: ^3.1.0
  cupertino_icons: ^1.0.8
  # State management
  provider: ^6.1.2
  # MQTT communication
  mqtt_client: ^10.6.0
  # Database (SQLite) — sqlite3 3.x 通过 build hooks 自动打包所有平台
  drift: ^2.22.1
  path_provider: ^2.1.5
  path: ^1.9.0
  # Navigation
  go_router: ^14.6.2
  # Screen keep-on (local plugin — Android/iOS only)
  wakelock:
    path: plugins/wakelock
  # App version info
  package_info_plus: ^8.1.2

  # UI
  google_fonts: ^6.2.1
  lucide_icons_flutter: ^3.1.14
  flutter_neumorphism_ui: ^1.0.2
  # File sharing
  share_plus: ^10.1.4
  # ZIP archive handling (for .3mf thumbnail extraction)
  archive: ^3.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3
  drift_dev: ^2.22.1
  build_runner: ^2.4.14

flutter:
  uses-material-design: true
  assets:
    - assets/printer_images/
    - assets/bambu control.json
    - bamboo_app_logo.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "bamboo_app_logo.png"
