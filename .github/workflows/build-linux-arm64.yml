name: Build Linux ARM64

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:  # 允许手动触发

jobs:
  build:
    runs-on: ubuntu-24.04-arm  # GitHub 原生 ARM64 运行器

    # 目标设备是 Debian 11 (glibc 2.31)。runner 自带系统（ubuntu-24.04 = glibc 2.39）
    # 编译会产出更高符号版本要求的二进制（GLIBC_2.34/2.38），手机上跑不了。
    # 整个 job 放进 debian:bullseye 容器（glibc 2.31，与目标设备一致），
    # 本机编译的 runner/插件代码符号要求 ≤ 2.31，产物即可直接在手机上运行。
    # （预编译 Flutter 引擎官方支持 Debian 10 / glibc 2.28，无此问题）
    # 注意：日后手机升级到 Trixie (glibc 2.41+) 可去掉 container，直接用 runner 系统。
    container:
      image: debian:bullseye
    defaults:
      run:
        shell: bash

    steps:
      - name: Install base tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            curl jq xz-utils unzip git ca-certificates

          # 容器内以 root 运行，但挂载的工作区属于 runner 用户，
          # git 会报 "dubious ownership"。提前把工作区（含 flutter SDK
          # 这个独立 git 仓库）标记为安全目录。
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/flutter"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Flutter SDK (arm64 artifacts)
        run: |
          # 官方 stable tarball 只有 x64，但 engine 产物有 arm64（flutter#188932）
          # 官方 workaround：下载 x64 包 → 删 bin/cache → 重新拉 arm64 引擎
          RELEASES=$(curl -sS https://storage.googleapis.com/flutter_infra_release/releases/releases_linux.json)
          VERSION=$(echo "$RELEASES" | jq -r '.current_release.stable')
          ARCHIVE=$(echo "$RELEASES" | jq -r --arg v "$VERSION" \
            '.releases[] | select(.hash==$v and .channel=="stable") | .archive')

          echo "Flutter $VERSION → $ARCHIVE"

          curl -sS "https://storage.googleapis.com/flutter_infra_release/releases/$ARCHIVE" \
            | tar xJ

          # 关键：删掉 x64 引擎缓存，让 flutter 按当前主机架构(aarch64)重新下载
          rm -rf flutter/bin/cache

          # 把 flutter 加入 PATH（只对后续步骤生效）
          echo "$PWD/flutter/bin" >> "$GITHUB_PATH"

          # 首次运行会下载 linux-arm64 的 dart-sdk + 引擎
          # 注意：$GITHUB_PATH 只对后续步骤生效，本步骤内要用完整路径
          flutter/bin/flutter --version

      - name: Install Linux build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            g++ clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev

      - name: Enable Linux platform
        working-directory: bambu_lab_app
        run: |
          # 如果 linux/ 目录不存在则创建（不覆盖已有平台）
          if [ ! -d linux ]; then
            flutter create --platforms=linux .
          fi

      # 注意：不要剥离 dependency_overrides！
      # sqlite3 锁定 2.x / drift <2.32 是应用代码依赖的 API：
      #   - database.dart 用 package:sqlite3/open.dart（2.x 才有）
      #   - sqlite3 3.x 移除了 open.dart（改用 native assets），编译会挂
      # 这些版本约束在标准 Linux GTK 构建上同样有效，无需修改。

      - name: Flutter pub get
        working-directory: bambu_lab_app
        run: flutter pub get

      - name: Build Linux release
        working-directory: bambu_lab_app
        run: flutter build linux --release

      - name: Package build artifacts
        working-directory: bambu_lab_app
        run: |
          BUNDLE_DIR="build/linux/arm64/release/bundle"
          ARTIFACT="bambu-lab-app-linux-arm64"

          mkdir -p "$ARTIFACT"
          cp -r "$BUNDLE_DIR"/* "$ARTIFACT/"

          # 一键启动脚本（Mobian / Debian glibc 环境直接启动）
          printf '%s\n' \
            "#!/bin/sh" \
            "cd \"\$(dirname \"\$0\")\" || exit 1" \
            "exec ./bambu_lab_app \"\$@\"" \
            > "$ARTIFACT/run.sh"
          chmod +x "$ARTIFACT/run.sh"

          # 开机自启动脚本（解压后配合 ~/.config/autostart 使用，见 README）
          if [ -f tools/mobian_autostart.sh ]; then
            cp tools/mobian_autostart.sh "$ARTIFACT/"
            chmod +x "$ARTIFACT/mobian_autostart.sh"
          fi

          printf '%s\n' \
            "Bambu Lab App — Linux ARM64" \
            "" \
            "运行方法（Mobian / Debian 系 ARM 设备）:" \
            "  ./run.sh  或  ./bambu_lab_app" \
            "" \
            "开机自启动: chmod +x mobian_autostart.sh，创建" \
            "  ~/.config/autostart/bambu-lab-app.desktop 指向它" \
            "  （脚本内有安装说明）" \
            "" \
            "依赖（如果运行报错缺少 .so）:" \
            "  sudo apt-get install libgtk-3-0 libsqlite3-0" \
            "" \
            "数据目录: ~/.local/share/bambu_lab_app/" \
            > "$ARTIFACT/README.txt"

          tar czf "${ARTIFACT}.tar.gz" "$ARTIFACT"
          echo "artifact_name=${ARTIFACT}.tar.gz" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bambu-lab-app-linux-arm64
          path: bambu_lab_app/bambu-lab-app-linux-arm64.tar.gz
          retention-days: 30
